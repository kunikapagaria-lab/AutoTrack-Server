name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name builder
          docker buildx inspect --bootstrap

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ── Branch backend (FastAPI + YOLO + PaddleOCR) ──────────────────────────
      - name: Download plate model
        run: |
          if [ -n "${{ secrets.PLATE_MODEL_URL }}" ]; then
            curl -fL -o licence_plate.pt "${{ secrets.PLATE_MODEL_URL }}"
          else
            echo "::warning::PLATE_MODEL_URL secret not set — plate detection will be disabled"
          fi

      - name: Build & push branch backend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg CACHEBUST=${{ github.run_id }} \
            --cache-from type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/autotrack-backend:buildcache \
            --cache-to   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/autotrack-backend:buildcache,mode=max \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/autotrack-backend:latest \
            --push \
            -f backend/Dockerfile \
            .

      # ── Frontend (React + Nginx) ──────────────────────────────────────────────
      - name: Build & push frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/autotrack-frontend:buildcache \
            --cache-to   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/autotrack-frontend:buildcache,mode=max \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/autotrack-frontend:latest \
            --push \
            -f Dockerfile.frontend \
            .

      # ── Cloud backend (lightweight FastAPI only) ──────────────────────────────
      - name: Build & push cloud backend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/autotrack-cloud:buildcache \
            --cache-to   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/autotrack-cloud:buildcache,mode=max \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/autotrack-cloud:latest \
            --push \
            -f cloud_server/Dockerfile \
            cloud_server
